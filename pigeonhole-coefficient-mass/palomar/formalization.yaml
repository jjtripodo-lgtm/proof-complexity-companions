version: "v0.4"
project:
  name: "A coefficient-mass separation for the pigeonhole principle"
  description: >-
    At twice as many pigeons as holes, the plain pigeonhole principle requires
    exponentially larger real twin-literal Nullstellensatz coefficient mass
    than the functional version. The compared theorem is the explicit
    diagonal separation.
